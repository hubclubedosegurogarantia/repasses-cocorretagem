# Publicação automática: a cada envio para a main, atualiza o Supabase (banco, funções,
# agendamento, login e e-mail pelo Resend) e publica o site no GitHub Pages.
# O que preencher (uma vez) está no README, "Publicação automática".
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase e Resend
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.pub.outputs.url }}
      anon: ${{ steps.pub.outputs.anon }}
      vapid: ${{ steps.pub.outputs.vapid }}
      app_url: ${{ steps.pub.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - id: pub
        run: python3 scripts/publicar.py supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENHA_INICIAL: ${{ secrets.SENHA_INICIAL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          EQUIPE: ${{ vars.EQUIPE }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          IA_MODELO: ${{ vars.IA_MODELO }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          APP_URL: ${{ vars.APP_URL }}
          REPO: ${{ github.repository }}

  site:
    name: Site no GitHub Pages
    needs: supabase
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publicar.py site
        env:
          SUPABASE_URL: ${{ needs.supabase.outputs.url }}
          SUPABASE_ANON_KEY: ${{ needs.supabase.outputs.anon }}
          VAPID_PUBLIC_KEY: ${{ needs.supabase.outputs.vapid }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
